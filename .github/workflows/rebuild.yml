name: Scheduled Build

on:
  schedule:
    # UTC 15:00 ＝ 日本時間（JST）0:00
    - cron: '0 15 * * *'
  # 手動で実行ボタンを押せるようにする設定
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger GitHub Pages rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Scheduled rebuild $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
